name: CI

on:
  workflow_call:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: Lint, Type-check, Test & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
      DATABASE_URL_UNPOOLED: 'postgresql://ci:ci@localhost:5432/ci'
      ADMIN_PASSWORD: 'ci-admin-password'
      ADMIN_SESSION_SECRET: 'ci-admin-session-secret-at-least-32-characters'
      CUSTOMER_SESSION_SECRET: 'ci-customer-session-secret-at-least-32-characters'
      BLOB_STORE_ID: 'ci-store'
      BLOB_WEBHOOK_PUBLIC_KEY: 'ci-public-key'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm prisma generate && pnpm exec tsc --noEmit

      - name: Format & Lint check
        run: pnpm exec biome check .

      - name: Dead code analysis
        run: pnpm exec knip

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build
