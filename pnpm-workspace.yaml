allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
overrides:
  fast-uri: 3.1.2
# `next` déclare @playwright/test en peer optionnel. Sans ce blocage, pnpm le
