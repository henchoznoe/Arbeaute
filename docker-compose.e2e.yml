name: arbeaute-e2e

services:
  db-e2e:
    image: postgres:18-alpine
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: arbeaute_e2e
      POSTGRES_PASSWORD: arbeaute_e2e
      POSTGRES_DB: arbeaute_e2e
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arbeaute_e2e -d arbeaute_e2e']
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql
