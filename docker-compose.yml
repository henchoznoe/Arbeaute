services:
  db:
    image: postgres:18-alpine
    container_name: db_arbeaute
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arbeaute
    volumes:
      - arbeaute_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d arbeaute']
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  arbeaute_pgdata:
